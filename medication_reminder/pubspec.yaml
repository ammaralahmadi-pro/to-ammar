name: medication_reminder
description: تطبيق تذكير بمواعيد الأدوية مع إشعارات محلية تعمل حتى مع إغلاق التطبيق.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # قاعدة بيانات محلية
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # إدارة الحالة
  provider: ^6.1.2

  # إشعارات محلية مجدولة
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # مساعدات
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
