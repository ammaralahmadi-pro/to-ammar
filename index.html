<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>يومي</title>
  <meta name="description" content="مهامك ومواعيد Outlook في مكان واحد" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">🗓️</span>
        <h1>يومي</h1>
      </div>
      <div class="header-actions">
        <div class="date-display" id="todayDate"></div>
        <button id="syncToggleBtn" class="icon-btn" title="مزامنة المهام بين جهازين" aria-label="مزامنة">🔗</button>
      </div>
    </header>

    <!-- لوحة مزامنة المهام بين جهازين -->
    <section id="syncPanel" class="panel sync-panel hidden">
      <div class="panel-header">
        <h2>مزامنة المهام بين جهازين</h2>
      </div>
      <p class="sync-hint">حط نفس "رمز المزامنة" في التطبيق على الجهازين، وهتشوف نفس المهام أول بأول على الاتنين.</p>
      <div class="sync-form">
        <input type="text" id="syncCodeInput" placeholder="اكتب رمز المزامنة (مثلاً: ammar-tasks-2026)" maxlength="80" />
        <button id="syncSaveBtn" class="btn btn-primary">حفظ وربط</button>
        <button id="syncClearBtn" class="btn btn-ghost">إلغاء الربط</button>
      </div>
      <div id="syncStatus" class="status-msg"></div>
    </section>

    <main class="content">
      <!-- قسم المواعيد -->
      <section class="panel calendar-panel">
        <div class="panel-header">
          <h2>مواعيد اليوم</h2>
          <button id="refreshCalendarBtn" class="icon-btn" title="تحديث" aria-label="تحديث">↻</button>
        </div>
        <div class="calendar-actions">
          <button id="googleSignInBtn" class="btn btn-outline">تسجيل الدخول بـ Google</button>
          <button id="googleSignOutBtn" class="btn btn-ghost hidden">تسجيل الخروج من Google</button>
          <button id="msSignInBtn" class="btn btn-outline">تسجيل الدخول بـ Outlook</button>
          <button id="msSignOutBtn" class="btn btn-ghost hidden">تسجيل الخروج من Outlook</button>
        </div>
        <div id="calendarStatus" class="status-msg"></div>
        <ul id="eventsList" class="events-list"></ul>
      </section>

      <!-- قسم المهام -->
      <section class="panel tasks-panel">
        <div class="panel-header">
          <h2>مهام اليوم</h2>
        </div>
        <form id="taskForm" class="task-form">
          <input type="text" id="taskTitle" placeholder="أضف مهمة جديدة..." required maxlength="200" />
          <input type="time" id="taskTime" />
          <button type="submit" class="btn btn-primary">إضافة</button>
        </form>
        <ul id="tasksList" class="tasks-list"></ul>
        <p id="tasksEmpty" class="empty-msg hidden">لا توجد مهام اليوم بعد، أضف أول مهمة لك.</p>
      </section>
    </main>

    <footer class="app-footer">
      <span>يومي — مهامك ومواعيدك في مكان واحد</span>
    </footer>
  </div>

  <!-- MSAL Browser (Microsoft Authentication Library) -->
  <script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Firebase (لمزامنة المهام بين جهازين) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/googleCalendar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
